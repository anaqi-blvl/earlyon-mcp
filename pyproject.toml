[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earlyon-mcp"
version = "0.1.0"
description = "MCP server exposing the Family Space Quinte EarlyON program calendar (events by day/week, type, venue, details)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.30,<2",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
earlyon-mcp = "earlyon_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real website (set EARLYON_LIVE=1)"]
